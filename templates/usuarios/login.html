{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
  <head>
  	<title>LCLAB | Login</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link href="https://fonts.googleapis.com/css?family=Lato:300,400,700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
	 <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Custom styles for this template ReisWeb-->
    <link rel="stylesheet" href="{% static 'usuarios/css/reisweb.css' %}">
    
</head>
<body>
    
    
<div class="login-card-container">
    <div class="login-image-col col-md-5"> 
       <!-- <div class="logo-overlay">
            <img src="{% static 'usuarios/images/lclab.svg' %}" alt="Logo LCLAB" class="img-fluid mb-2" width="80">
        </div>-->
    </div>
    
    <div class="login-form-col col-md-7"> 
        <div class="text-center mb-4">
            <img src="{% static 'usuarios/images/lclab.svg' %}" alt="Logo lclab" class="img-fluid mb-2" style="max-height: 60px;">
            <h2 class="h5 text-white">Acesso ao Sistema</h2>
        </div>
        
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label for="id_username" class="form-label">Usuário:</label>
                <input type="text" class="form-control" name="username" id="inputUsuario" placeholder="Usuário" required>
            </div>

            <div class="mb-3">
                <label for="id_password" class="form-label">Senha:</label>
                <input type="password" class="form-control" name="password" id="inputSenha" placeholder="Senha" required>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check">
                    <input type="checkbox" class="form-check-input" id="checkLembrar">
                    <label class="text-custom-link small" for="checkLembrar">Me manter conectado</label>
                </div>
                <a href="#" class="text-custom-link small text-decoration-none">Recuperar senha</a>
            </div>

            <div class="d-grid gap-2">
                {% if form.errors %}
                    <div class="alert alert-danger mt-3">
                    Usuário ou senha inválidos.
                    </div>
                {% endif %}
                <!--Exibe as mensagens de alerta django
                {% if messages %}
                    <br>
                    {% for message in messages %}
                    <div class="alert {{ message.tags }}">{{ message }}</div>
                    {% endfor %}
                {% endif %}-->
                <p style="color: red;">{{ erro }}</p>
                <button type="submit" class="btn btn-custom-primary btn-lg">CONTINUAR</button>
            </div>

        </form>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
